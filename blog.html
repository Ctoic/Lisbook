<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- fontawesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="Images/favicon.jpg" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <script type="text/javascript" data-cmp-ab="1"
    src="https://cdn.consentmanager.net/delivery/autoblocking/1dae96c2c2031.js"
    data-cmp-host="a.delivery.consentmanager.net" data-cmp-cdn="cdn.consentmanager.net" data-cmp-codesrc="16">
  </script>
  <style>body.blog-page { cursor: auto; }</style>
  <title>Blog - Lisbook</title>
</head>

<body class="bg-gray-900 text-gray-300 d-flex flex-column min-vh-100 blog-page">
  <script>
    // Initialize theme with fallback (no localStorage dependency)
    (function() {
      try {
        const saved = localStorage.getItem('theme');
        const theme = saved === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        if (document.body) {
          document.body.classList.remove('light-theme', 'dark-theme');
          document.body.classList.add(theme + '-theme');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        if (document.body) {
          document.body.classList.add('dark-theme');
        }
      }
    })();
  </script>

  <!-- Dynamic Navbar Placeholder -->
  <div id="navbar-placeholder"></div>

  <!-- Main Content -->
  <main class="container my-5">
    <h1 class="text-3xl font-bold text-gray-300 mb-2">Blog</h1>
    <p class="mb-6">Updates, announcements, and articles from Lisbook.</p>

    <div id="blog-list" class="grid gap-6 grid-cols-1 md:grid-cols-2 lg:grid-cols-3"></div>
    <p id="blog-empty" class="hidden">No posts yet. Check back soon!</p>
  </main>

  <!-- Dynamic Footer Placeholder -->
  <div id="footer-placeholder" class="mt-auto"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="data/blog-posts.js"></script>
  <script src="dynamic-components.js"></script>
  <script>
    // Renders one card per post, newest first.
    (function () {
      const list = document.getElementById("blog-list");
      const empty = document.getElementById("blog-empty");
      const posts = (window.BLOG_POSTS || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1));

      if (posts.length === 0) {
        empty.classList.remove("hidden");
        return;
      }

      posts.forEach(function (post) {
        const card = document.createElement("article");
        card.className = "bg-gray-800 border border-gray-700 rounded-lg shadow-lg p-6 flex flex-col";

        const title = document.createElement("h2");
        title.className = "text-xl font-semibold text-gray-300 mb-2";
        title.textContent = post.title;

        const meta = document.createElement("p");
        meta.className = "text-sm text-gray-400 mb-3";
        meta.textContent = post.date + " · " + post.author;

        const summary = document.createElement("p");
        summary.className = "mb-4 flex-grow";
        summary.textContent = post.summary;

        const link = document.createElement("a");
        link.href = "blog-post.html?id=" + encodeURIComponent(post.id);
        link.className = "text-green-500 hover:text-green-400 font-medium";
        link.textContent = "Read More →";

        card.append(title, meta, summary, link);
        list.appendChild(card);
      });
    })();
  </script>
</body>
</html>
